name: Release

# Push a tag such as v0.1.0 to build the binary and publish a GitHub release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $version" >&2
            exit 1
          fi

      - name: Install toolchain and libusb
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y pkg-config libusb-1.0-0-dev

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Package
        run: |
          name="at89s5x-isp-${GITHUB_REF_NAME}-linux-x86_64"
          mkdir "$name"
          cp target/release/at89s5x-isp README.md README.zh-TW.md LICENSE "$name"/
          cp -r examples "$name"/
          tar czf "$name.tar.gz" "$name"
          sha256sum "$name.tar.gz" > "$name.tar.gz.sha256"
          ldd target/release/at89s5x-isp

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notes.md <<'NOTES'
          Prebuilt Linux x86_64 binary of `at89s5x-isp`.

          - Verified on real hardware: FT232RL (bit-bang) with an AT89S52.
          - Not verified: AT89S51 on a real chip, the FT232H path, Windows and macOS.
          - USB permissions on Linux: run `scripts/setup-linux.sh` from the repository once.
          - See the README for wiring and usage.
          NOTES
          gh release create "$GITHUB_REF_NAME" \
            "at89s5x-isp-${GITHUB_REF_NAME}-linux-x86_64.tar.gz" \
            "at89s5x-isp-${GITHUB_REF_NAME}-linux-x86_64.tar.gz.sha256" \
            --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            --generate-notes \
            --verify-tag
