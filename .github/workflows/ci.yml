name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and libusb
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y pkg-config libusb-1.0-0-dev
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
      - name: Test
        run: cargo test --locked
