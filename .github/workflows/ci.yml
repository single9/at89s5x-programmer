name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install toolchain and libusb
        run: |
          rustup toolchain install stable --profile minimal -c clippy,rustfmt
          rustup default stable
          sudo apt-get update
          sudo apt-get install -y pkg-config libusb-1.0-0-dev
      - name: Format
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked -- -D warnings
      - name: Test
        run: cargo test --locked

  # Compile on every platform and keep the binaries so they can be tried on
  # real hardware. Only Linux has been verified with an adapter so far.
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bin: at89s5x-isp
          - os: windows-latest
            bin: at89s5x-isp.exe
          - os: macos-latest
            bin: at89s5x-isp
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install libusb (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libusb-1.0-0-dev
      - name: Install libusb (macOS)
        if: runner.os == 'macOS'
        run: brew install libusb pkgconf
      - name: Test
        run: cargo test --locked
      - name: Build
        run: cargo build --release --locked
      - uses: actions/upload-artifact@v4
        with:
          name: at89s5x-isp-${{ matrix.os }}
          path: target/release/${{ matrix.bin }}

  # One macOS binary that runs on both Apple Silicon and Intel. libusb is built
  # from source for each architecture (no Homebrew libusb, which is arm64-only).
  macos-universal:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin
      - name: Build both architectures
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
      - name: Combine and sign
        run: |
          mkdir out
          lipo -create -output out/at89s5x-isp \
            target/aarch64-apple-darwin/release/at89s5x-isp \
            target/x86_64-apple-darwin/release/at89s5x-isp
          # Apple Silicon refuses unsigned binaries; an ad-hoc signature is enough.
          codesign --force --sign - out/at89s5x-isp
          file out/at89s5x-isp
          lipo -info out/at89s5x-isp
      - uses: actions/upload-artifact@v4
        with:
          name: at89s5x-isp-macos-universal
          path: out/at89s5x-isp
