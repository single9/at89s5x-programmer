[package]
name = "at89s5x-isp"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "ISP programmer for AT89S51/AT89S52 using an FT232RL or FT232H"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.6", features = ["derive"] }
embedded-hal = "1.0.0"
ftdi-embedded-hal = { version = "0.24.0", features = ["libftd2xx"] }
ihex = "3.0.0"
rusb = "0.9.4"
