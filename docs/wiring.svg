<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1090 620" font-family="Menlo, Consolas, monospace">
<style>
 .wire{stroke:#333;stroke-width:2;fill:none}
 .box{fill:#fdfdfd;stroke:#333;stroke-width:2}
 .dot{fill:#333}
 .pin{font-size:13px;fill:#111}
 .sig{font-size:13px;fill:#c0392b;font-weight:bold}
 .small{font-size:11px;fill:#555}
 .title{font-size:18px;font-weight:bold;fill:#111}
 .box-title{font-size:15px;font-weight:bold;fill:#111}
 .note{font-size:12px;fill:#555}
</style>
<rect width="1090" height="620" fill="#ffffff"/>
<text x="30" y="36" class="title">FT232RL / FT232H → AT89S51 / S52 wiring</text>
<rect x="90" y="90" width="210" height="370" class="box"/>
<text x="195" y="116" text-anchor="middle" class="box-title">FT232RL / FT232H</text>
<text x="195" y="134" text-anchor="middle" class="small">(USB ↔ PC)</text>
<rect x="520" y="90" width="260" height="370" class="box"/>
<text x="650" y="116" text-anchor="middle" class="box-title">AT89S51 / S52</text>
<text x="650" y="134" text-anchor="middle" class="small">(DIP-40, relevant pins only)</text>
<line x1="300" y1="170" x2="520" y2="170" class="wire"/>
<circle cx="300" cy="170" r="3.5" class="dot"/>
<circle cx="520" cy="170" r="3.5" class="dot"/>
<text x="290" y="174" text-anchor="end" class="pin">RXD (D1) / AD1</text>
<text x="530" y="174" class="pin">P1.5 (pin 6)</text>
<text x="395" y="162" text-anchor="middle" class="sig">MOSI →</text>
<line x1="300" y1="230" x2="520" y2="230" class="wire"/>
<circle cx="300" cy="230" r="3.5" class="dot"/>
<circle cx="520" cy="230" r="3.5" class="dot"/>
<text x="290" y="234" text-anchor="end" class="pin">RTS# (D2) / AD2</text>
<text x="530" y="234" class="pin">P1.6 (pin 7)</text>
<text x="395" y="222" text-anchor="middle" class="sig">← MISO</text>
<line x1="300" y1="290" x2="520" y2="290" class="wire"/>
<circle cx="300" cy="290" r="3.5" class="dot"/>
<circle cx="520" cy="290" r="3.5" class="dot"/>
<text x="290" y="294" text-anchor="end" class="pin">TXD (D0) / AD0</text>
<text x="530" y="294" class="pin">P1.7 (pin 8)</text>
<text x="395" y="282" text-anchor="middle" class="sig">SCK →</text>
<line x1="300" y1="350" x2="520" y2="350" class="wire"/>
<circle cx="300" cy="350" r="3.5" class="dot"/>
<circle cx="520" cy="350" r="3.5" class="dot"/>
<text x="290" y="354" text-anchor="end" class="pin">CTS# (D3) / AD3</text>
<text x="530" y="354" class="pin">RST (pin 9)</text>
<text x="395" y="342" text-anchor="middle" class="sig">RST →</text>
<circle cx="440" cy="350" r="3.5" class="dot"/>
<line x1="440" y1="350" x2="440" y2="370" class="wire"/>
<rect x="431" y="370" width="18" height="34" class="box"/>
<text x="456" y="391" class="small">R1 10 kΩ</text>
<line x1="440" y1="404" x2="440" y2="430" class="wire"/>
<circle cx="440" cy="430" r="3.5" class="dot"/>
<line x1="780" y1="170" x2="860" y2="170" class="wire"/>
<line x1="780" y1="210" x2="860" y2="210" class="wire"/>
<line x1="860" y1="170" x2="860" y2="210" class="wire"/>
<circle cx="860" cy="190" r="3.5" class="dot"/>
<text x="770" y="174" text-anchor="end" class="pin">VCC (pin 40)</text>
<text x="770" y="214" text-anchor="end" class="pin">EA/VPP (pin 31)</text>
<line x1="860" y1="210" x2="860" y2="222" class="wire"/>
<line x1="860" y1="222" x2="860" y2="231" class="wire"/><line x1="848" y1="231" x2="872" y2="231" class="wire"/><line x1="848" y1="237" x2="872" y2="237" class="wire"/><line x1="860" y1="237" x2="860" y2="246" class="wire"/><text x="878" y="232" text-anchor="start" class="small">C1</text><text x="878" y="246" text-anchor="start" class="small">100nF</text>
<line x1="860" y1="246" x2="860" y2="262" class="wire"/>
<line x1="850" y1="262" x2="870" y2="262" class="wire"/><line x1="854" y1="267" x2="866" y2="267" class="wire"/><line x1="858" y1="272" x2="862" y2="272" class="wire"/>
<text x="860" y="150" text-anchor="middle" class="sig">+5V</text>
<text x="860" y="164" text-anchor="middle" class="small">external supply</text>
<line x1="780" y1="300" x2="980" y2="300" class="wire"/>
<line x1="780" y1="380" x2="920" y2="380" class="wire"/>
<text x="770" y="304" text-anchor="end" class="pin">XTAL1 (pin 19)</text>
<text x="770" y="384" text-anchor="end" class="pin">XTAL2 (pin 18)</text>
<circle cx="920" cy="300" r="3.5" class="dot"/>
<circle cx="920" cy="380" r="3.5" class="dot"/>
<line x1="920" y1="300" x2="920" y2="322" class="wire"/>
<line x1="920" y1="358" x2="920" y2="380" class="wire"/>
<line x1="906" y1="322" x2="934" y2="322" class="wire"/>
<line x1="906" y1="358" x2="934" y2="358" class="wire"/>
<rect x="912" y="328" width="16" height="24" class="box"/>
<text x="900" y="338" text-anchor="end" class="small">Y1</text><text x="900" y="352" text-anchor="end" class="small">12 MHz</text>
<line x1="980" y1="300" x2="980" y2="408" class="wire"/>
<line x1="980" y1="408" x2="980" y2="417" class="wire"/><line x1="968" y1="417" x2="992" y2="417" class="wire"/><line x1="968" y1="423" x2="992" y2="423" class="wire"/><line x1="980" y1="423" x2="980" y2="432" class="wire"/><text x="998" y="418" text-anchor="start" class="small">C2</text><text x="998" y="432" text-anchor="start" class="small">22pF</text>
<line x1="980" y1="432" x2="980" y2="448" class="wire"/>
<line x1="920" y1="380" x2="920" y2="408" class="wire"/>
<line x1="920" y1="408" x2="920" y2="417" class="wire"/><line x1="908" y1="417" x2="932" y2="417" class="wire"/><line x1="908" y1="423" x2="932" y2="423" class="wire"/><line x1="920" y1="423" x2="920" y2="432" class="wire"/><text x="902" y="418" text-anchor="end" class="small">C3</text><text x="902" y="432" text-anchor="end" class="small">22pF</text>
<line x1="920" y1="432" x2="920" y2="448" class="wire"/>
<line x1="920" y1="448" x2="980" y2="448" class="wire"/>
<circle cx="980" cy="448" r="3.5" class="dot"/>
<circle cx="920" cy="448" r="3.5" class="dot"/>
<circle cx="950" cy="448" r="3.5" class="dot"/>
<line x1="950" y1="448" x2="950" y2="462" class="wire"/>
<line x1="940" y1="462" x2="960" y2="462" class="wire"/><line x1="944" y1="467" x2="956" y2="467" class="wire"/><line x1="948" y1="472" x2="952" y2="472" class="wire"/>
<line x1="300" y1="430" x2="520" y2="430" class="wire"/>
<circle cx="300" cy="430" r="3.5" class="dot"/>
<circle cx="520" cy="430" r="3.5" class="dot"/>
<text x="290" y="434" text-anchor="end" class="pin">GND</text>
<text x="530" y="434" class="pin">GND (pin 20)</text>
<text x="360" y="422" text-anchor="middle" class="sig">GND</text>
<circle cx="360" cy="430" r="3.5" class="dot"/>
<line x1="360" y1="430" x2="360" y2="444" class="wire"/>
<line x1="350" y1="444" x2="370" y2="444" class="wire"/><line x1="354" y1="449" x2="366" y2="449" class="wire"/><line x1="358" y1="454" x2="362" y2="454" class="wire"/>
<text x="30" y="530" class="note">EA/VPP (pin 31) must be tied to VCC so the CPU runs from internal flash.</text>
<text x="30" y="548" class="note">SCK must stay below 1/16 of the target crystal frequency (default 100 kHz is safe for crystals ≥ 3.2 MHz).</text>
<text x="30" y="566" class="note">R1 keeps RST low when the adapter is idle. The target needs its own power and running crystal.</text>
<text x="30" y="584" class="note">FT232RL: Dn = bit-bang pin. FT232H: ADn = MPSSE pin (untested). Set VCCIO (3.3 V / 5 V) to match the target.</text>
</svg>
