<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 820" font-family="Menlo, Consolas, monospace">
  <rect x="0" y="0" width="1100" height="820" fill="#ffffff"/>

  <style>
    .wire { stroke:#333; stroke-width:2; fill:none; }
    .railgnd { stroke:#333; stroke-width:2; fill:none; }
    .chip { fill:#fdfdfd; stroke:#333; stroke-width:2; }
    .pinlabel { font-size:13px; fill:#111; }
    .rightlabel { font-size:12px; fill:#111; }
    .netnote { font-size:11px; fill:#c0392b; }
    .caption { font-size:12px; fill:#555; }
    .title { font-size:17px; fill:#111; font-weight:bold; }
    .boxtitle { font-size:14px; fill:#111; font-weight:bold; }
    .boxcaption { font-size:11px; fill:#555; }
    .dot { fill:#333; }
    .insettitle { font-size:12px; fill:#111; font-weight:bold; }
    .insetsmall { font-size:10px; fill:#555; }
    .insetlabel { font-size:10px; fill:#111; }
  </style>

  <text x="20" y="28" class="title">AT89S51 SPI ISP wiring (FT232H)</text>

  <!-- ================= MAIN DIAGRAM ================= -->

  <!-- AT89S51 body -->
  <rect x="300" y="80" width="220" height="320" class="chip"/>
  <text x="410" y="105" text-anchor="middle" class="boxtitle">AT89S51</text>
  <text x="410" y="122" text-anchor="middle" class="boxcaption">(DIP-40, only relevant pins shown)</text>

  <!-- Left side: power / EA / crystal pins — wiring detail in the reference circuit below -->
  <line x1="250" y1="160" x2="300" y2="160" class="wire"/>
  <circle cx="300" cy="160" r="3" class="dot"/>
  <text x="240" y="152" text-anchor="end" class="pinlabel">VCC — pin 40</text>
  <text x="240" y="174" text-anchor="end" class="netnote">&#8594; +5V</text>

  <line x1="250" y1="225" x2="300" y2="225" class="wire"/>
  <circle cx="300" cy="225" r="3" class="dot"/>
  <text x="240" y="217" text-anchor="end" class="pinlabel">EA/VPP — pin 31</text>
  <text x="240" y="239" text-anchor="end" class="netnote">&#8594; +5V (tie high)</text>

  <line x1="250" y1="290" x2="300" y2="290" class="wire"/>
  <circle cx="300" cy="290" r="3" class="dot"/>
  <text x="240" y="282" text-anchor="end" class="pinlabel">XTAL1 — pin 19</text>
  <text x="240" y="304" text-anchor="end" class="caption">&#8594; crystal (see reference below)</text>

  <line x1="250" y1="355" x2="300" y2="355" class="wire"/>
  <circle cx="300" cy="355" r="3" class="dot"/>
  <text x="240" y="347" text-anchor="end" class="pinlabel">XTAL2 — pin 18</text>
  <text x="240" y="369" text-anchor="end" class="caption">&#8594; crystal (see reference below)</text>

  <!-- GND (bottom of chip) -->
  <line x1="410" y1="400" x2="410" y2="445" class="wire"/>
  <circle cx="410" cy="400" r="3" class="dot"/>
  <text x="418" y="428" class="pinlabel">GND — pin 20</text>

  <!-- Right side: real signal wiring to FT232H -->
  <line x1="520" y1="170" x2="700" y2="225" class="wire"/>
  <circle cx="520" cy="170" r="3" class="dot"/>
  <text x="530" y="158" class="rightlabel">P1.7 / SCK (pin 8)</text>

  <line x1="520" y1="230" x2="700" y2="280" class="wire"/>
  <circle cx="520" cy="230" r="3" class="dot"/>
  <text x="530" y="218" class="rightlabel">P1.6 / MISO (pin 7)</text>

  <line x1="520" y1="290" x2="700" y2="335" class="wire"/>
  <circle cx="520" cy="290" r="3" class="dot"/>
  <text x="530" y="278" class="rightlabel">P1.5 / MOSI (pin 6)</text>

  <line x1="520" y1="350" x2="700" y2="390" class="wire"/>
  <circle cx="520" cy="350" r="3" class="dot"/>
  <text x="530" y="338" class="rightlabel">RST (pin 9)</text>

  <!-- FT232H body -->
  <rect x="700" y="140" width="180" height="280" class="chip"/>
  <text x="790" y="165" text-anchor="middle" class="boxtitle">FT232H breakout</text>
  <text x="790" y="182" text-anchor="middle" class="boxcaption">(USB &#8596; PC)</text>

  <circle cx="700" cy="225" r="3" class="dot"/>
  <text x="712" y="229" class="pinlabel">AD0 (SCK)</text>

  <circle cx="700" cy="280" r="3" class="dot"/>
  <text x="712" y="284" class="pinlabel">AD2 (MISO)</text>

  <circle cx="700" cy="335" r="3" class="dot"/>
  <text x="712" y="339" class="pinlabel">AD1 (MOSI)</text>

  <circle cx="700" cy="390" r="3" class="dot"/>
  <text x="712" y="394" class="pinlabel">AD3 (RST)</text>

  <line x1="790" y1="420" x2="790" y2="445" class="wire"/>
  <text x="798" y="437" class="pinlabel">GND</text>

  <!-- common GND rail linking both boards -->
  <line x1="410" y1="445" x2="790" y2="445" class="railgnd"/>
  <circle cx="410" cy="445" r="3" class="dot"/>
  <circle cx="790" cy="445" r="3" class="dot"/>
  <text x="600" y="463" text-anchor="middle" class="caption">common GND (both boards share this reference)</text>

  <text x="600" y="488" text-anchor="middle" class="caption">EA/VPP, crystal, and decoupling-cap wiring — see reference circuit below</text>

  <!-- ================= REFERENCE / SUPPORT CIRCUIT (inset) ================= -->
  <rect x="40" y="520" width="1020" height="240" fill="none" stroke="#999" stroke-width="1.5" stroke-dasharray="6,4"/>
  <text x="60" y="548" class="insettitle">Reference: typical support circuit (often already present on the target board)</text>

  <!-- Sub A: EA tie -->
  <text x="70" y="590" class="insettitle">EA/VPP (pin 31)</text>
  <line x1="210" y1="600" x2="330" y2="600" class="wire"/>
  <circle cx="210" cy="600" r="3" class="dot"/>
  <circle cx="330" cy="600" r="3" class="dot"/>
  <text x="340" y="604" class="insetlabel">VCC (+5V)</text>
  <text x="70" y="628" class="insetsmall">Ties EA/VPP high so the CPU executes</text>
  <text x="70" y="642" class="insetsmall">from internal flash memory.</text>

  <!-- Sub B: decoupling cap C1 -->
  <text x="420" y="590" class="insettitle">C1 — VCC/GND decoupling</text>
  <line x1="500" y1="604" x2="500" y2="626" class="wire"/>
  <circle cx="500" cy="604" r="3" class="dot"/>
  <text x="508" y="610" class="insetlabel">VCC</text>
  <line x1="480" y1="626" x2="520" y2="626" class="wire"/>
  <line x1="480" y1="634" x2="520" y2="634" class="wire"/>
  <line x1="500" y1="634" x2="500" y2="658" class="wire"/>
  <line x1="480" y1="658" x2="520" y2="658" class="wire"/>
  <line x1="487" y1="665" x2="513" y2="665" class="wire"/>
  <line x1="494" y1="672" x2="506" y2="672" class="wire"/>
  <text x="420" y="696" class="insetsmall">100nF ceramic, placed close to the</text>
  <text x="420" y="710" class="insetsmall">VCC/GND pins.</text>

  <!-- Sub C: crystal oscillator Y1 + C2/C3 -->
  <text x="700" y="590" class="insettitle">Y1 + C2/C3 — crystal oscillator</text>

  <line x1="820" y1="606" x2="820" y2="634" class="wire"/>
  <text x="760" y="612" text-anchor="end" class="insetlabel">&#8594; XTAL1</text>

  <rect x="800" y="634" width="40" height="28" fill="#fdfdfd" stroke="#333" stroke-width="2"/>
  <text x="820" y="628" text-anchor="middle" class="insetsmall">Y1</text>
  <text x="850" y="652" class="insetsmall">11.0592MHz</text>

  <line x1="820" y1="662" x2="820" y2="690" class="wire"/>
  <text x="760" y="690" text-anchor="end" class="insetlabel">&#8594; XTAL2</text>

  <!-- C2 (load cap on XTAL1 lead) -->
  <line x1="820" y1="616" x2="900" y2="616" class="wire"/>
  <circle cx="820" cy="616" r="3" class="dot"/>
  <line x1="900" y1="616" x2="900" y2="634" class="wire"/>
  <line x1="885" y1="634" x2="915" y2="634" class="wire"/>
  <line x1="885" y1="640" x2="915" y2="640" class="wire"/>
  <line x1="900" y1="640" x2="900" y2="658" class="wire"/>
  <line x1="885" y1="658" x2="915" y2="658" class="wire"/>
  <line x1="891" y1="664" x2="909" y2="664" class="wire"/>
  <line x1="897" y1="670" x2="903" y2="670" class="wire"/>
  <text x="922" y="638" class="insetsmall">C2 22pF</text>

  <!-- C3 (load cap on XTAL2 lead) -->
  <line x1="820" y1="680" x2="900" y2="680" class="wire"/>
  <circle cx="820" cy="680" r="3" class="dot"/>
  <line x1="900" y1="680" x2="900" y2="698" class="wire"/>
  <line x1="885" y1="698" x2="915" y2="698" class="wire"/>
  <line x1="885" y1="704" x2="915" y2="704" class="wire"/>
  <line x1="900" y1="704" x2="900" y2="722" class="wire"/>
  <line x1="885" y1="722" x2="915" y2="722" class="wire"/>
  <line x1="891" y1="728" x2="909" y2="728" class="wire"/>
  <line x1="897" y1="734" x2="903" y2="734" class="wire"/>
  <text x="922" y="702" class="insetsmall">C3 22pF</text>

  <!-- ================= GLOBAL NOTES ================= -->
  <text x="20" y="790" class="caption">SCK must stay below 1/16 of the target's crystal frequency (100 kHz default is safe for crystals &#8805; 3.2 MHz).</text>
  <text x="20" y="807" class="caption">The FT232H does not power the target or supply its clock — VCC and the oscillator must already be active on the target board.</text>
</svg>
