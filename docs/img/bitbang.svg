<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 452" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif"><rect width="910" height="452" fill="#ffffff"/><style>.t{font-size:15px;fill:#222}.s{font-size:12.5px;fill:#666}.b{font-size:15px;font-weight:bold;fill:#222}.m{font-family:Menlo,Consolas,monospace;font-size:14px;fill:#222}.r{font-size:14px;font-weight:bold;fill:#c0392b}.box{fill:#f7f9fb;stroke:#4a5a6a;stroke-width:2}.hi{fill:#fff3cd;stroke:#c98a00;stroke-width:2}.w{stroke:#333;stroke-width:2.5;fill:none}.thin{stroke:#999;stroke-width:1;stroke-dasharray:4 4}.ok{fill:#e7f6ec;stroke:#2e8b57;stroke-width:2}</style><text x="30" y="32" class="b" text-anchor="start">FT232RL 無硬體 SPI：每個 USB 位元組對應某一時間點的接腳電位</text><rect x="30" y="52" width="250" height="120" rx="8" class="box"/><text x="155" y="76" class="b" text-anchor="middle">位元組的位元定義</text><text x="48" y="100" class="m" text-anchor="start">D3</text><text x="82" y="100" class="t" text-anchor="start">RST</text><text x="48" y="117" class="m" text-anchor="start">D2</text><text x="82" y="117" class="t" text-anchor="start">MISO (讀)</text><text x="48" y="134" class="m" text-anchor="start">D1</text><text x="82" y="134" class="t" text-anchor="start">MOSI</text><text x="48" y="151" class="m" text-anchor="start">D0</text><text x="82" y="151" class="t" text-anchor="start">SCK</text><text x="190" y="100" class="s" text-anchor="start"> (D7–D4 未使用)</text><text x="310" y="70" class="t" text-anchor="start">每個 SPI 位元需 2 個取樣：先設定資料 (SCK 低)，再將 SCK 拉高。</text><text x="310" y="92" class="t" text-anchor="start">以下以依序送出位元 1、0 為例 (RST 維持高電位)：</text><text x="30" y="238" class="b" text-anchor="start">送出</text><text x="30" y="318" class="b" text-anchor="start">讀回</text><rect x="150" y="205" width="96" height="50" rx="6" class="box"/><text x="198" y="228" class="m" text-anchor="middle">0x0A</text><text x="198" y="246" class="s" text-anchor="middle">1010</text><text x="198" y="198" class="s" text-anchor="middle">資料 1，SCK 低</text><rect x="150" y="285" width="96" height="50" rx="6" class="box"/><text x="198" y="308" class="t" text-anchor="middle">舊資料</text><text x="198" y="326" class="s" text-anchor="middle">丟掉</text><rect x="260" y="205" width="96" height="50" rx="6" class="hi"/><text x="308" y="228" class="m" text-anchor="middle">0x0B</text><text x="308" y="246" class="s" text-anchor="middle">1011</text><text x="308" y="198" class="s" text-anchor="middle">SCK 拉高</text><rect x="260" y="285" width="96" height="50" rx="6" class="box"/><text x="308" y="308" class="t" text-anchor="middle">接腳電位</text><text x="308" y="326" class="s" text-anchor="middle">前一格的結果</text><rect x="370" y="205" width="96" height="50" rx="6" class="box"/><text x="418" y="228" class="m" text-anchor="middle">0x08</text><text x="418" y="246" class="s" text-anchor="middle">1000</text><text x="418" y="198" class="s" text-anchor="middle">資料 0，SCK 低</text><rect x="370" y="285" width="96" height="50" rx="6" class="ok"/><text x="418" y="308" class="t" text-anchor="middle">接腳電位</text><text x="418" y="326" class="s" text-anchor="middle">前一格的結果</text><rect x="480" y="205" width="96" height="50" rx="6" class="hi"/><text x="528" y="228" class="m" text-anchor="middle">0x09</text><text x="528" y="246" class="s" text-anchor="middle">1001</text><text x="528" y="198" class="s" text-anchor="middle">SCK 拉高</text><rect x="480" y="285" width="96" height="50" rx="6" class="box"/><text x="528" y="308" class="t" text-anchor="middle">接腳電位</text><text x="528" y="326" class="s" text-anchor="middle">前一格的結果</text><rect x="590" y="205" width="96" height="50" rx="6" class="box"/><text x="638" y="228" class="m" text-anchor="middle">0x08</text><text x="638" y="246" class="s" text-anchor="middle">1000</text><text x="638" y="198" class="s" text-anchor="middle">補一格收尾</text><rect x="590" y="285" width="96" height="50" rx="6" class="ok"/><text x="638" y="308" class="t" text-anchor="middle">接腳電位</text><text x="638" y="326" class="s" text-anchor="middle">前一格的結果</text><line x1="198" y1="255" x2="308" y2="285" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="308" y1="255" x2="418" y2="285" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="418" y1="255" x2="528" y2="285" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="528" y1="255" x2="638" y2="285" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/><text x="418" y="352" class="s" text-anchor="middle">位元 1 的 MISO</text><text x="638" y="352" class="s" text-anchor="middle">位元 2 的 MISO</text><text x="30" y="384" class="t" text-anchor="start">讀回資料比送出延遲一格，因此各位元的 MISO 取自「SCK 拉高那一格」的下一格 (綠色)。</text><text x="30" y="408" class="t" text-anchor="start">取樣速率 = 鮑率 × 16；每個 SPI 位元佔 2 個取樣，故鮑率設為 SCK 頻率 ÷ 8。</text><text x="30" y="432" class="s" text-anchor="start">此做法已由 MOSI 與 MISO 短路的自我測試 (selftest 指令) 驗證。</text></svg>
