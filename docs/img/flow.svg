<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 385" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif"><rect width="910" height="385" fill="#ffffff"/><style>.t{font-size:15px;fill:#222}.s{font-size:12.5px;fill:#666}.b{font-size:15px;font-weight:bold;fill:#222}.m{font-family:Menlo,Consolas,monospace;font-size:14px;fill:#222}.r{font-size:14px;font-weight:bold;fill:#c0392b}.box{fill:#f7f9fb;stroke:#4a5a6a;stroke-width:2}.hi{fill:#fff3cd;stroke:#c98a00;stroke-width:2}.w{stroke:#333;stroke-width:2.5;fill:none}.thin{stroke:#999;stroke-width:1;stroke-dasharray:4 4}.ok{fill:#e7f6ec;stroke:#2e8b57;stroke-width:2}</style><text x="30" y="32" class="b" text-anchor="start">flash 指令一路做了什麼</text><rect x="30" y="55" width="185" height="112" rx="8" class="box"/><text x="44" y="79" class="r" text-anchor="start">1</text><text x="64" y="80" class="b" text-anchor="start">找轉接器</text><text x="44" y="117" class="s" text-anchor="start">依 USB ID 判斷</text><text x="44" y="134" class="s" text-anchor="start">FT232R / FT232H</text><line x1="215" y1="111" x2="243" y2="111" class="w"/><polygon points="243,111 234,106 234,116" fill="#333"/><rect x="245" y="55" width="185" height="112" rx="8" class="box"/><text x="259" y="79" class="r" text-anchor="start">2</text><text x="279" y="80" class="b" text-anchor="start">拉高 RST</text><text x="259" y="117" class="s" text-anchor="start">等 20 ms</text><text x="259" y="134" class="s" text-anchor="start">讓晶片穩定</text><line x1="430" y1="111" x2="458" y2="111" class="w"/><polygon points="458,111 449,106 449,116" fill="#333"/><rect x="460" y="55" width="185" height="112" rx="8" class="box"/><text x="474" y="79" class="r" text-anchor="start">3</text><text x="494" y="80" class="b" text-anchor="start">Programming</text><text x="494" y="99" class="b" text-anchor="start">Enable</text><text x="474" y="136" class="s" text-anchor="start">送 AC 53 00 00</text><text x="474" y="153" class="s" text-anchor="start">等回 0x69</text><line x1="645" y1="111" x2="673" y2="111" class="w"/><polygon points="673,111 664,106 664,116" fill="#333"/><rect x="675" y="55" width="185" height="112" rx="8" class="box"/><text x="689" y="79" class="r" text-anchor="start">4</text><text x="709" y="80" class="b" text-anchor="start">讀簽名</text><text x="689" y="117" class="s" text-anchor="start">1E 52 06</text><text x="689" y="134" class="s" text-anchor="start">= AT89S52</text><rect x="30" y="205" width="185" height="112" rx="8" class="box"/><text x="44" y="229" class="r" text-anchor="start">5</text><text x="64" y="230" class="b" text-anchor="start">擦除</text><text x="44" y="267" class="s" text-anchor="start">AC 80 00 00</text><text x="44" y="284" class="s" text-anchor="start">等 500 ms</text><line x1="215" y1="261" x2="243" y2="261" class="w"/><polygon points="243,261 234,256 234,266" fill="#333"/><rect x="245" y="205" width="185" height="112" rx="8" class="box"/><text x="259" y="229" class="r" text-anchor="start">6</text><text x="279" y="230" class="b" text-anchor="start">寫入</text><text x="259" y="267" class="s" text-anchor="start">每個非 FF 位元組</text><text x="259" y="284" class="s" text-anchor="start">40 AH AL 資料</text><line x1="430" y1="261" x2="458" y2="261" class="w"/><polygon points="458,261 449,256 449,266" fill="#333"/><rect x="460" y="205" width="185" height="112" rx="8" class="box"/><text x="474" y="229" class="r" text-anchor="start">7</text><text x="494" y="230" class="b" text-anchor="start">驗證</text><text x="474" y="267" class="s" text-anchor="start">20 AH AL 00</text><text x="474" y="284" class="s" text-anchor="start">讀回來比對</text><line x1="645" y1="261" x2="673" y2="261" class="w"/><polygon points="673,261 664,256 664,266" fill="#333"/><rect x="675" y="205" width="185" height="112" rx="8" class="ok"/><text x="689" y="229" class="r" text-anchor="start">8</text><text x="709" y="230" class="b" text-anchor="start">放開 RST</text><text x="689" y="267" class="s" text-anchor="start">R1 拉低</text><text x="689" y="284" class="s" text-anchor="start">程式開始跑</text><polyline points="767,167 767,186 122,186 122,205" class="w"/><polygon points="122,205 117,196 127,196" fill="#333"/><text x="30" y="365" class="s" text-anchor="start">每一步失敗都會停下並印出原因；第 3 步沒有回 0x69 是最常見的問題（接線、晶振、電源）。</text></svg>
