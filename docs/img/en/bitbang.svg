<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 452" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif"><rect width="910" height="452" fill="#ffffff"/><style>.t{font-size:15px;fill:#222}.s{font-size:12.5px;fill:#666}.b{font-size:15px;font-weight:bold;fill:#222}.m{font-family:Menlo,Consolas,monospace;font-size:14px;fill:#222}.r{font-size:14px;font-weight:bold;fill:#c0392b}.box{fill:#f7f9fb;stroke:#4a5a6a;stroke-width:2}.hi{fill:#fff3cd;stroke:#c98a00;stroke-width:2}.w{stroke:#333;stroke-width:2.5;fill:none}.thin{stroke:#999;stroke-width:1;stroke-dasharray:4 4}.ok{fill:#e7f6ec;stroke:#2e8b57;stroke-width:2}</style><text x="30" y="32" class="b" text-anchor="start">FT232RL has no hardware SPI: each USB byte is the pin state at one instant</text><rect x="30" y="52" width="250" height="120" rx="8" class="box"/><text x="155" y="76" class="b" text-anchor="middle">Bit assignment</text><text x="48" y="100" class="m" text-anchor="start">D3</text><text x="82" y="100" class="t" text-anchor="start">RST</text><text x="48" y="117" class="m" text-anchor="start">D2</text><text x="82" y="117" class="t" text-anchor="start">MISO (input)</text><text x="48" y="134" class="m" text-anchor="start">D1</text><text x="82" y="134" class="t" text-anchor="start">MOSI</text><text x="48" y="151" class="m" text-anchor="start">D0</text><text x="82" y="151" class="t" text-anchor="start">SCK</text><text x="170" y="100" class="s" text-anchor="start">(D7-D4 unused)</text><text x="310" y="70" class="t" text-anchor="start">Each SPI bit takes 2 samples: set the data (SCK low), then raise SCK.</text><text x="310" y="92" class="t" text-anchor="start">Example: sending bit 1, then bit 0 (RST held high):</text><text x="30" y="238" class="b" text-anchor="start">Sent</text><text x="30" y="318" class="b" text-anchor="start">Read back</text><rect x="150" y="205" width="96" height="50" rx="6" class="box"/><text x="198" y="228" class="m" text-anchor="middle">0x0A</text><text x="198" y="246" class="s" text-anchor="middle">1010</text><text x="198" y="198" class="s" text-anchor="middle">data 1, SCK low</text><rect x="150" y="285" width="96" height="50" rx="6" class="box"/><text x="198" y="308" class="t" text-anchor="middle">stale</text><text x="198" y="326" class="s" text-anchor="middle">discard</text><rect x="260" y="205" width="96" height="50" rx="6" class="hi"/><text x="308" y="228" class="m" text-anchor="middle">0x0B</text><text x="308" y="246" class="s" text-anchor="middle">1011</text><text x="308" y="198" class="s" text-anchor="middle">SCK high</text><rect x="260" y="285" width="96" height="50" rx="6" class="box"/><text x="308" y="308" class="t" text-anchor="middle">pin state</text><text x="308" y="326" class="s" text-anchor="middle">prev. sample</text><rect x="370" y="205" width="96" height="50" rx="6" class="box"/><text x="418" y="228" class="m" text-anchor="middle">0x08</text><text x="418" y="246" class="s" text-anchor="middle">1000</text><text x="418" y="198" class="s" text-anchor="middle">data 0, SCK low</text><rect x="370" y="285" width="96" height="50" rx="6" class="ok"/><text x="418" y="308" class="t" text-anchor="middle">pin state</text><text x="418" y="326" class="s" text-anchor="middle">prev. sample</text><rect x="480" y="205" width="96" height="50" rx="6" class="hi"/><text x="528" y="228" class="m" text-anchor="middle">0x09</text><text x="528" y="246" class="s" text-anchor="middle">1001</text><text x="528" y="198" class="s" text-anchor="middle">SCK high</text><rect x="480" y="285" width="96" height="50" rx="6" class="box"/><text x="528" y="308" class="t" text-anchor="middle">pin state</text><text x="528" y="326" class="s" text-anchor="middle">prev. sample</text><rect x="590" y="205" width="96" height="50" rx="6" class="box"/><text x="638" y="228" class="m" text-anchor="middle">0x08</text><text x="638" y="246" class="s" text-anchor="middle">1000</text><text x="638" y="198" class="s" text-anchor="middle">extra trailing sample</text><rect x="590" y="285" width="96" height="50" rx="6" class="ok"/><text x="638" y="308" class="t" text-anchor="middle">pin state</text><text x="638" y="326" class="s" text-anchor="middle">prev. sample</text><line x1="198" y1="255" x2="308" y2="285" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="308" y1="255" x2="418" y2="285" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="418" y1="255" x2="528" y2="285" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/><line x1="528" y1="255" x2="638" y2="285" stroke="#999" stroke-width="1.5" stroke-dasharray="4 3"/><text x="418" y="352" class="s" text-anchor="middle">MISO of bit 1</text><text x="638" y="352" class="s" text-anchor="middle">MISO of bit 2</text><text x="30" y="384" class="t" text-anchor="start">Readback lags the output by one sample, so each bit's MISO is taken from the entry after the SCK-high one (green).</text><text x="30" y="408" class="t" text-anchor="start">Sample rate = baud x 16; one SPI bit = 2 samples, so baud = SCK frequency / 8.</text><text x="30" y="432" class="s" text-anchor="start">Verified with a MOSI-to-MISO loopback (the selftest command).</text></svg>
