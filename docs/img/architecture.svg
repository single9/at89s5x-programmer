<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 910 345" font-family="'Noto Sans CJK TC','PingFang TC','Microsoft JhengHei',sans-serif"><rect width="910" height="345" fill="#ffffff"/><style>.t{font-size:15px;fill:#222}.s{font-size:12.5px;fill:#666}.b{font-size:15px;font-weight:bold;fill:#222}.m{font-family:Menlo,Consolas,monospace;font-size:14px;fill:#222}.r{font-size:14px;font-weight:bold;fill:#c0392b}.box{fill:#f7f9fb;stroke:#4a5a6a;stroke-width:2}.hi{fill:#fff3cd;stroke:#c98a00;stroke-width:2}.w{stroke:#333;stroke-width:2.5;fill:none}.thin{stroke:#999;stroke-width:1;stroke-dasharray:4 4}.ok{fill:#e7f6ec;stroke:#2e8b57;stroke-width:2}</style><text x="30" y="34" class="b" text-anchor="start">整體架構：從你的電腦到晶片</text><rect x="30" y="55" width="320" height="235" rx="8" class="box"/><text x="190" y="80" class="b" text-anchor="middle">你的電腦（at89s5x-isp）</text><rect x="48" y="98" width="284" height="50" rx="6" class="box"/><text x="60" y="119" class="m" text-anchor="start">main.rs</text><text x="60" y="138" class="s" text-anchor="start">指令列：info / flash / verify</text><rect x="48" y="160" width="284" height="50" rx="6" class="box"/><text x="60" y="181" class="m" text-anchor="start">isp.rs</text><text x="60" y="200" class="s" text-anchor="start">燒錄協定：該送哪些位元組</text><rect x="48" y="222" width="284" height="50" rx="6" class="hi"/><text x="60" y="243" class="m" text-anchor="start">bitbang.rs</text><text x="60" y="262" class="s" text-anchor="start">把位元組變成腳位上下起伏</text><line x1="350" y1="172" x2="430" y2="172" class="w"/><polygon points="430,172 421,167 421,177" fill="#333"/><text x="390" y="160" class="b" text-anchor="middle">USB</text><rect x="430" y="105" width="130" height="135" rx="8" class="box"/><text x="495" y="135" class="b" text-anchor="middle">FT232RL</text><text x="495" y="160" class="s" text-anchor="middle">USB 轉序列埠</text><text x="495" y="180" class="s" text-anchor="middle">晶片</text><text x="495" y="210" class="s" text-anchor="middle">借用 4 隻腳</text><text x="495" y="228" class="s" text-anchor="middle">當 GPIO 用</text><line x1="560" y1="128" x2="700" y2="128" class="w"/><text x="630" y="122" class="r" text-anchor="middle">SCK</text><text x="572" y="144" class="s" text-anchor="start">TXD</text><line x1="560" y1="160" x2="700" y2="160" class="w"/><text x="630" y="154" class="r" text-anchor="middle">MOSI</text><text x="572" y="176" class="s" text-anchor="start">RXD</text><line x1="560" y1="192" x2="700" y2="192" class="w"/><text x="630" y="186" class="r" text-anchor="middle">MISO</text><text x="572" y="208" class="s" text-anchor="start">RTS#</text><line x1="560" y1="224" x2="700" y2="224" class="w"/><text x="630" y="218" class="r" text-anchor="middle">RST</text><text x="572" y="240" class="s" text-anchor="start">CTS#</text><rect x="700" y="70" width="180" height="200" rx="8" class="ok"/><text x="790" y="98" class="b" text-anchor="middle">AT89S52</text><text x="790" y="122" class="s" text-anchor="middle">pin 8 / 6 / 7 / 9</text><rect x="722" y="140" width="136" height="100" rx="6" class="box"/><text x="790" y="170" class="b" text-anchor="middle">內部 Flash</text><text x="790" y="192" class="s" text-anchor="middle">8 KB 程式記憶體</text><text x="790" y="212" class="s" text-anchor="middle">要寫進去的地方</text><text x="30" y="325" class="s" text-anchor="start">只有 4 條訊號線（外加共地）：目標板自己供電、自己有晶振，轉接器只負責「說話」。</text></svg>
